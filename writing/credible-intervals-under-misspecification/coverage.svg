<title id="title">Coverage falls as the true standard deviation rises</title>
<desc id="desc">The nominal 95 percent posterior interval covers about 100, 95, 81, and 67 percent of the time at true standard deviations 0.5, 1, 1.5, and 2. Sandwich intervals remain near 95 percent.</desc>
