<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">A fourteen-tick signal cycle</title><desc id="desc">North green for four ticks, north yellow for two, clearance for one, east green for four, east yellow for two, clearance for one. Then repeat.</desc>
<rect width="1000" height="330" rx="12" fill="#faf9f6"/>
<text x="40" y="42" fill="#236d58" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2">ONE FULL CYCLE · 14 TICKS</text>
<text x="40" y="80" fill="#202624" font-family="Georgia,serif" font-size="30">Take turns, with time between them.</text>
<rect x="40.00" y="117" width="259.86" height="71" rx="5" fill="#236d58"/>
<text x="169.93" y="147" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="13">N–S green</text>
<text x="169.93" y="170" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="12">4 ticks</text>
<text x="40.00" y="212" fill="#626c66" font-family="system-ui,sans-serif" font-size="12">0</text>
<rect x="302.86" y="117" width="128.43" height="71" rx="5" fill="#e9bd62"/>
<text x="367.07" y="147" text-anchor="middle" fill="#202624" font-family="system-ui,sans-serif" font-size="13">Yellow</text>
<text x="367.07" y="170" text-anchor="middle" fill="#202624" font-family="system-ui,sans-serif" font-size="12">2 ticks</text>
<text x="302.86" y="212" fill="#626c66" font-family="system-ui,sans-serif" font-size="12">4</text>
<rect x="434.29" y="117" width="62.71" height="71" rx="5" fill="#d9dfd9"/>
<text x="465.64" y="147" text-anchor="middle" fill="#202624" font-family="system-ui,sans-serif" font-size="13">Clear</text>
<text x="465.64" y="170" text-anchor="middle" fill="#202624" font-family="system-ui,sans-serif" font-size="12">1 tick</text>
<text x="434.29" y="212" fill="#626c66" font-family="system-ui,sans-serif" font-size="12">6</text>
<rect x="500.00" y="117" width="259.86" height="71" rx="5" fill="#236d58"/>
<text x="629.93" y="147" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="13">E–W green</text>
<text x="629.93" y="170" text-anchor="middle" fill="#ffffff" font-family="system-ui,sans-serif" font-size="12">4 ticks</text>
<text x="500.00" y="212" fill="#626c66" font-family="system-ui,sans-serif" font-size="12">7</text>
<rect x="762.86" y="117" width="128.43" height="71" rx="5" fill="#e9bd62"/>
<text x="827.07" y="147" text-anchor="middle" fill="#202624" font-family="system-ui,sans-serif" font-size="13">Yellow</text>
<text x="827.07" y="170" text-anchor="middle" fill="#202624" font-family="system-ui,sans-serif" font-size="12">2 ticks</text>
<text x="762.86" y="212" fill="#626c66" font-family="system-ui,sans-serif" font-size="12">11</text>
<rect x="894.29" y="117" width="62.71" height="71" rx="5" fill="#d9dfd9"/>
<text x="925.64" y="147" text-anchor="middle" fill="#202624" font-family="system-ui,sans-serif" font-size="13">Clear</text>
<text x="925.64" y="170" text-anchor="middle" fill="#202624" font-family="system-ui,sans-serif" font-size="12">1 tick</text>
<text x="894.29" y="212" fill="#626c66" font-family="system-ui,sans-serif" font-size="12">13</text>
<text x="960" y="212" text-anchor="end" fill="#626c66" font-family="system-ui,sans-serif" font-size="12">14</text>
<path d="M955 229V255H45V233M39 242L45 233L51 242" fill="none" stroke="#626c66" stroke-width="1.5"/>
<rect x="418" y="242" width="164" height="25" fill="#faf9f6"/><text x="500" y="259" text-anchor="middle" fill="#626c66" font-family="system-ui,sans-serif" font-size="12">and begin again</text>
<text x="40" y="303" fill="#626c66" font-family="system-ui,sans-serif" font-size="12">Abstract ticks, not seconds. Each road stays red throughout the other road’s sequence.</text></svg>